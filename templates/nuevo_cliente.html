{% extends "base.html" %}

{% block title %}Nuevo Cliente - Óptica Express{% endblock %}
{% block header_title %}Alta de Cliente{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-emerald-600"></i> Registrar Datos del Cliente
    </h2>

    <form action="/clientes/nuevo" method="post" class="space-y-4">
        <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nombre Completo *</label>
            <input type="text" name="nombre_completo" required placeholder="Ej: María González" 
                   class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">DNI / Documento</label>
                <input type="text" name="dni" placeholder="Ej: 30123456" 
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Teléfono / WhatsApp</label>
                <input type="text" name="telefono" placeholder="Ej: 1122334455" 
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Observaciones / Notas Clínicas</label>
            <textarea name="observaciones" rows="3" placeholder="Alergias, preferencia de armazones, etc." 
                      class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"></textarea>
        </div>

        <div class="pt-4 flex justify-end gap-3 border-t border-slate-100">
            <a href="/" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-semibold hover:bg-slate-200 transition">Cancelar</a>
            <button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold hover:bg-emerald-700 transition">Guardar Cliente</button>
        </div>
    </form>
</div>
{% endblock %}
